{% extends "base.html" %}

{% block subtitle %}{% endblock %}

{% block page %}
  <div>
    <pre data-module="text_view">
      <div class="loading">
        {{ _('Loading...') }}
      </div>
    </pre>
  </div>

  {% block scripts %}
    <script>
      var preload_resource = {{ resource | tojson }};
      var resource_url = {{ resource_url | tojson }};
      var preview_metadata = {{ preview_metadata | tojson }};
    </script>
  {% endblock %}

  {% block styles %}{% endblock %}
  {% block custom_styles %}{% endblock %}

  {% asset 'ckanext-textview/main' %}
{% endblock %}
